<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="hospBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0b1728" />
      <stop offset="100%" stop-color="#070c14" />
    </linearGradient>
    <linearGradient id="hospBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes pulseHosp { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.9; } }
    .pulse-hosp { animation: pulseHosp 2.4s infinite ease-in-out; }
  </style>

  <!-- Frame -->
  <rect width="798" height="358" x="1" y="1" rx="16" fill="url(#hospBg)" stroke="url(#hospBorder)" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="24" y="20" width="752" height="38" rx="8" fill="#111c30" stroke="#1e293b" />
  <circle cx="44" cy="39" r="5" fill="#ef4444" />
  <circle cx="60" cy="39" r="5" fill="#f59e0b" />
  <circle cx="76" cy="39" r="5" fill="#10b981" />
  <text x="100" y="43" class="mono" font-size="11" fill="#94a3b8" letter-spacing="1">PROJECT:02 // CLINICAL OPERATIONS &amp; HEALTHCARE ERP</text>
  <g class="pulse-hosp">
    <circle cx="700" cy="39" r="4" fill="#38bdf8" />
  </g>
  <text x="712" y="43" class="mono" font-size="11" fill="#38bdf8" font-weight="600">RBAC ONLINE</text>

  <!-- Title & Tagline -->
  <text x="28" y="94" class="sans" font-size="30" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">HospitalOS</text>
  <text x="28" y="118" class="sans" font-size="13" fill="#94a3b8">End-to-end hospital management system with multi-role clinical workflows &amp; records</text>

  <!-- Role Architecture Grid -->
  <g transform="translate(28, 140)">
    <!-- Role 1: Doctor -->
    <rect x="0" y="0" width="175" height="66" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="14" y="22" class="sans" font-size="12" fill="#38bdf8" font-weight="700">👨‍⚕️ DOCTOR DESK</text>
    <text x="14" y="40" class="mono" font-size="11" fill="#94a3b8">Active Queue: 14</text>
    <text x="14" y="54" class="mono" font-size="10" fill="#64748b">E-Prescriptions · Rx</text>

    <!-- Role 2: Patient -->
    <rect x="190" y="0" width="175" height="66" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="204" y="22" class="sans" font-size="12" fill="#a78bfa" font-weight="700">🧑 PATIENT PORTAL</text>
    <text x="204" y="40" class="mono" font-size="11" fill="#94a3b8">Appointments: Synced</text>
    <text x="204" y="54" class="mono" font-size="10" fill="#64748b">History &amp; EHR Download</text>

    <!-- Role 3: Pharmacy -->
    <rect x="380" y="0" width="175" height="66" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="394" y="22" class="sans" font-size="12" fill="#34d399" font-weight="700">💊 PHARMACY &amp; RX</text>
    <text x="394" y="40" class="mono" font-size="11" fill="#94a3b8">Stock In Stock: 98%</text>
    <text x="394" y="54" class="mono" font-size="10" fill="#64748b">Direct Rx Dispense</text>

    <!-- Role 4: Admin & Billing -->
    <rect x="570" y="0" width="175" height="66" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="584" y="22" class="sans" font-size="12" fill="#f43f5e" font-weight="700">🛡️ ADMIN &amp; BILLING</text>
    <text x="584" y="40" class="mono" font-size="11" fill="#94a3b8">Invoices &amp; Staff ERP</text>
    <text x="584" y="54" class="mono" font-size="10" fill="#64748b">Audit Trails &amp; Logs</text>
  </g>

  <!-- Security & Flow Bar -->
  <g transform="translate(28, 222)">
    <rect x="0" y="0" width="745" height="64" rx="8" fill="#0a1324" stroke="#1e293b" />
    <text x="16" y="24" class="mono" font-size="11" fill="#38bdf8" letter-spacing="1">SYSTEM ARCHITECTURE PIPELINE</text>
    
    <!-- Flow pills -->
    <g transform="translate(16, 34)">
      <rect x="0" y="0" width="130" height="22" rx="4" fill="#172554" />
      <text x="12" y="15" class="mono" font-size="10.5" fill="#93c5fd">React 19 SPA</text>
      
      <text x="138" y="15" class="mono" font-size="11" fill="#64748b">→</text>
      
      <rect x="156" y="0" width="130" height="22" rx="4" fill="#2e1065" />
      <text x="166" y="15" class="mono" font-size="10.5" fill="#d8b4fe">JWT Auth Guard</text>
      
      <text x="294" y="15" class="mono" font-size="11" fill="#64748b">→</text>
      
      <rect x="312" y="0" width="150" height="22" rx="4" fill="#064e3b" />
      <text x="322" y="15" class="mono" font-size="10.5" fill="#6ee7b7">Express REST Routes</text>
      
      <text x="470" y="15" class="mono" font-size="11" fill="#64748b">→</text>
      
      <rect x="488" y="0" width="140" height="22" rx="4" fill="#0c4a6e" />
      <text x="498" y="15" class="mono" font-size="10.5" fill="#7dd3fc">MongoDB Atlas</text>
    </g>
  </g>

  <!-- Tech Badges Footer -->
  <g transform="translate(28, 308)">
    <rect x="0" y="0" width="82" height="26" rx="5" fill="#17122e" stroke="#8b5cf6" stroke-opacity="0.4" />
    <text x="12" y="17" class="mono" font-size="11" fill="#c4b5fd">React 19</text>

    <rect x="90" y="0" width="76" height="26" rx="5" fill="#0f291e" stroke="#10b981" stroke-opacity="0.4" />
    <text x="100" y="17" class="mono" font-size="11" fill="#6ee7b7">Node.js</text>

    <rect x="174" y="0" width="78" height="26" rx="5" fill="#0f291e" stroke="#10b981" stroke-opacity="0.4" />
    <text x="184" y="17" class="mono" font-size="11" fill="#6ee7b7">Express</text>

    <rect x="260" y="0" width="85" height="26" rx="5" fill="#082f49" stroke="#0284c7" stroke-opacity="0.4" />
    <text x="270" y="17" class="mono" font-size="11" fill="#7dd3fc">MongoDB</text>

    <rect x="353" y="0" width="85" height="26" rx="5" fill="#1e1b4b" stroke="#8b5cf6" stroke-opacity="0.4" />
    <text x="364" y="17" class="mono" font-size="11" fill="#c4b5fd">JWT Auth</text>

    <rect x="446" y="0" width="105" height="26" rx="5" fill="#083344" stroke="#06b6d4" stroke-opacity="0.4" />
    <text x="456" y="17" class="mono" font-size="11" fill="#67e8f9">Tailwind CSS</text>

    <rect x="559" y="0" width="76" height="26" rx="5" fill="#111827" stroke="#475569" stroke-opacity="0.4" />
    <text x="572" y="17" class="mono" font-size="11" fill="#cbd5e1">Vercel</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="apiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="apiBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes pulseLive { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    .pulse-live { animation: pulseLive 2s infinite ease-in-out; }
  </style>

  <!-- Frame -->
  <rect width="798" height="358" x="1" y="1" rx="16" fill="url(#apiBg)" stroke="url(#apiBorder)" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="24" y="20" width="752" height="38" rx="8" fill="#131d33" stroke="#1e293b" />
  <circle cx="44" cy="39" r="5" fill="#ef4444" />
  <circle cx="60" cy="39" r="5" fill="#f59e0b" />
  <circle cx="76" cy="39" r="5" fill="#10b981" />
  <text x="100" y="43" class="mono" font-size="11" fill="#94a3b8" letter-spacing="1">PROJECT:01 // OBSERVABILITY &amp; HEALTH PLATFORM</text>
  <g class="pulse-live">
    <circle cx="700" cy="39" r="4" fill="#34d399" />
  </g>
  <text x="712" y="43" class="mono" font-size="11" fill="#34d399" font-weight="600">LIVE ENGINE</text>

  <!-- Project Title and Tagline -->
  <text x="28" y="94" class="sans" font-size="30" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">API Sentinel</text>
  <text x="28" y="118" class="sans" font-size="13" fill="#94a3b8">Real-time endpoint observability, latency telemetry &amp; automated failure alerting</text>

  <!-- Left: Live Telemetry Rows -->
  <g transform="translate(28, 140)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="450" height="42" rx="6" fill="#0f172a" stroke="#1e293b" />
    <circle cx="16" cy="21" r="4" fill="#34d399" />
    <text x="32" y="25" class="mono" font-size="12" fill="#e2e8f0">POST /api/v1/auth/verify</text>
    <rect x="270" y="10" width="56" height="22" rx="4" fill="#064e3b" />
    <text x="278" y="25" class="mono" font-size="11" fill="#34d399" font-weight="700">200 OK</text>
    <text x="344" y="25" class="mono" font-size="12" fill="#22d3ee">34ms</text>
    <text x="398" y="25" class="mono" font-size="11" fill="#94a3b8">99.98%</text>

    <!-- Row 2 -->
    <rect x="0" y="50" width="450" height="42" rx="6" fill="#0f172a" stroke="#1e293b" />
    <circle cx="16" cy="71" r="4" fill="#34d399" />
    <text x="32" y="75" class="mono" font-size="12" fill="#e2e8f0">GET  /api/v1/telemetry</text>
    <rect x="270" y="60" width="56" height="22" rx="4" fill="#064e3b" />
    <text x="278" y="75" class="mono" font-size="11" fill="#34d399" font-weight="700">200 OK</text>
    <text x="344" y="75" class="mono" font-size="12" fill="#22d3ee">18ms</text>
    <text x="398" y="75" class="mono" font-size="11" fill="#94a3b8">100.0%</text>

    <!-- Row 3 -->
    <rect x="0" y="100" width="450" height="42" rx="6" fill="#0f172a" stroke="#1e293b" />
    <circle cx="16" cy="121" r="4" fill="#34d399" />
    <text x="32" y="125" class="mono" font-size="12" fill="#e2e8f0">POST /api/v1/webhook</text>
    <rect x="270" y="110" width="62" height="22" rx="4" fill="#1e1b4b" />
    <text x="275" y="125" class="mono" font-size="11" fill="#a78bfa" font-weight="700">201 NEW</text>
    <text x="344" y="125" class="mono" font-size="12" fill="#22d3ee">86ms</text>
    <text x="398" y="125" class="mono" font-size="11" fill="#94a3b8">99.94%</text>
  </g>

  <!-- Right: Real-time Latency Chart Box -->
  <g transform="translate(500, 140)">
    <rect x="0" y="0" width="276" height="142" rx="8" fill="#0c1322" stroke="#1e293b" />
    <text x="14" y="24" class="mono" font-size="11" fill="#64748b" letter-spacing="1">LATENCY TELEMETRY (ms)</text>
    <text x="210" y="24" class="mono" font-size="11" fill="#22d3ee">AVG 42ms</text>

    <!-- Chart Grid lines -->
    <line x1="14" y1="50" x2="262" y2="50" stroke="#1e293b" stroke-dasharray="2 3" />
    <line x1="14" y1="80" x2="262" y2="80" stroke="#1e293b" stroke-dasharray="2 3" />
    <line x1="14" y1="110" x2="262" y2="110" stroke="#1e293b" stroke-dasharray="2 3" />

    <!-- Wave Area -->
    <polygon points="14,120 30,105 60,110 90,75 120,85 150,55 180,68 210,48 240,62 262,52 262,125 14,125" fill="url(#waveGrad)" />
    <!-- Wave Line -->
    <polyline points="14,120 30,105 60,110 90,75 120,85 150,55 180,68 210,48 240,62 262,52" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)" />
    <!-- Current Point -->
    <circle cx="262" cy="52" r="4" fill="#38bdf8" />
  </g>

  <!-- Tech Badges Footer -->
  <g transform="translate(28, 308)">
    <rect x="0" y="0" width="82" height="26" rx="5" fill="#17122e" stroke="#8b5cf6" stroke-opacity="0.4" />
    <text x="12" y="17" class="mono" font-size="11" fill="#c4b5fd">React 19</text>

    <rect x="90" y="0" width="60" height="26" rx="5" fill="#17122e" stroke="#8b5cf6" stroke-opacity="0.4" />
    <text x="103" y="17" class="mono" font-size="11" fill="#c4b5fd">Vite</text>

    <rect x="158" y="0" width="80" height="26" rx="5" fill="#0f291e" stroke="#10b981" stroke-opacity="0.4" />
    <text x="170" y="17" class="mono" font-size="11" fill="#6ee7b7">Node.js</text>

    <rect x="246" y="0" width="80" height="26" rx="5" fill="#0f291e" stroke="#10b981" stroke-opacity="0.4" />
    <text x="257" y="17" class="mono" font-size="11" fill="#6ee7b7">Express</text>

    <rect x="334" y="0" width="85" height="26" rx="5" fill="#082f49" stroke="#0284c7" stroke-opacity="0.4" />
    <text x="345" y="17" class="mono" font-size="11" fill="#7dd3fc">MongoDB</text>

    <rect x="427" y="0" width="80" height="26" rx="5" fill="#082f49" stroke="#0284c7" stroke-opacity="0.4" />
    <text x="440" y="17" class="mono" font-size="11" fill="#7dd3fc">Mongoose</text>

    <rect x="515" y="0" width="68" height="26" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.4" />
    <text x="526" y="17" class="mono" font-size="11" fill="#a5b4fc">Axios</text>
  </g>
</svg>

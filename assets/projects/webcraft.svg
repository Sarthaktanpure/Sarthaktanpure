<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a1a" />
      <stop offset="50%" stop-color="#140f26" />
      <stop offset="100%" stop-color="#080714" />
    </linearGradient>
    <linearGradient id="webBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes pulseWeb { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    .pulse-web { animation: pulseWeb 2s infinite ease-in-out; }
  </style>

  <!-- Frame -->
  <rect width="798" height="358" x="1" y="1" rx="16" fill="url(#webBg)" stroke="url(#webBorder)" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="24" y="20" width="752" height="38" rx="8" fill="#1b122e" stroke="#2d1d4f" />
  <circle cx="44" cy="39" r="5" fill="#ef4444" />
  <circle cx="60" cy="39" r="5" fill="#f59e0b" />
  <circle cx="76" cy="39" r="5" fill="#10b981" />
  <text x="100" y="43" class="mono" font-size="11" fill="#94a3b8" letter-spacing="1">VENTURE:05 // DIGITAL PRODUCT STUDIO &amp; CLIENT ARCHITECTURE</text>
  <g class="pulse-web">
    <circle cx="700" cy="39" r="4" fill="#f43f5e" />
  </g>
  <text x="712" y="43" class="mono" font-size="11" fill="#f43f5e" font-weight="600">STUDIO ACTIVE</text>

  <!-- Title & Tagline -->
  <text x="28" y="94" class="sans" font-size="30" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">WebCraft Studio</text>
  <text x="28" y="118" class="sans" font-size="13" fill="#94a3b8">Bespoke web development agency — architecting, building, and deploying modern client solutions</text>

  <!-- Middle Studio Execution Pipeline -->
  <g transform="translate(28, 140)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="170" height="142" rx="8" fill="#180e2b" stroke="#2c1a4d" />
    <text x="14" y="24" class="mono" font-size="10.5" fill="#f43f5e" letter-spacing="0.5">01 // REQUIREMENTS</text>
    <text x="14" y="52" class="sans" font-size="12" fill="#f8fafc" font-weight="600">Client Discovery</text>
    <text x="14" y="74" class="mono" font-size="10.5" fill="#94a3b8">• Problem Framing</text>
    <text x="14" y="94" class="mono" font-size="10.5" fill="#94a3b8">• Technical Scope</text>
    <text x="14" y="114" class="mono" font-size="10.5" fill="#94a3b8">• Architecture SLA</text>

    <!-- Arrow -->
    <text x="176" y="76" class="mono" font-size="14" fill="#64748b">→</text>

    <!-- Stage 2 -->
    <rect x="194" y="0" width="170" height="142" rx="8" fill="#180e2b" stroke="#2c1a4d" />
    <text x="14" y="24" class="mono" font-size="10.5" fill="#a78bfa" letter-spacing="0.5">02 // ARCHITECTURE</text>
    <text x="14" y="52" class="sans" font-size="12" fill="#f8fafc" font-weight="600">System Design</text>
    <text x="14" y="74" class="mono" font-size="10.5" fill="#94a3b8">• Component Systems</text>
    <text x="14" y="94" class="mono" font-size="10.5" fill="#94a3b8">• Data Modeling</text>
    <text x="14" y="114" class="mono" font-size="10.5" fill="#94a3b8">• API Integrations</text>

    <!-- Arrow -->
    <text x="370" y="76" class="mono" font-size="14" fill="#64748b">→</text>

    <!-- Stage 3 -->
    <rect x="388" y="0" width="170" height="142" rx="8" fill="#180e2b" stroke="#2c1a4d" />
    <text x="14" y="24" class="mono" font-size="10.5" fill="#22d3ee" letter-spacing="0.5">03 // ENGINEERING</text>
    <text x="14" y="52" class="sans" font-size="12" fill="#f8fafc" font-weight="600">Full-Stack Build</text>
    <text x="14" y="74" class="mono" font-size="10.5" fill="#94a3b8">• Responsive UI/UX</text>
    <text x="14" y="94" class="mono" font-size="10.5" fill="#94a3b8">• Dynamic APIs</text>
    <text x="14" y="114" class="mono" font-size="10.5" fill="#94a3b8">• Cross-Browser QA</text>

    <!-- Arrow -->
    <text x="564" y="76" class="mono" font-size="14" fill="#64748b">→</text>

    <!-- Stage 4 -->
    <rect x="582" y="0" width="162" height="142" rx="8" fill="#0f1f2e" stroke="#0e4e68" />
    <text x="14" y="24" class="mono" font-size="10.5" fill="#34d399" letter-spacing="0.5">04 // PRODUCTION</text>
    <text x="14" y="52" class="sans" font-size="12" fill="#f8fafc" font-weight="600">Live Delivery</text>
    <text x="14" y="74" class="mono" font-size="10.5" fill="#94a3b8">• Edge CDN Setup</text>
    <text x="14" y="94" class="mono" font-size="10.5" fill="#94a3b8">• SEO Optimization</text>
    <text x="14" y="114" class="mono" font-size="10.5" fill="#94a3b8">• SSL &amp; High Speed</text>
  </g>

  <!-- Tech Badges Footer -->
  <g transform="translate(28, 308)">
    <rect x="0" y="0" width="150" height="26" rx="5" fill="#2e1065" stroke="#7c3aed" stroke-opacity="0.4" />
    <text x="12" y="17" class="mono" font-size="11" fill="#c4b5fd">Role: Co-Founder</text>

    <rect x="158" y="0" width="85" height="26" rx="5" fill="#17122e" stroke="#8b5cf6" stroke-opacity="0.4" />
    <text x="170" y="17" class="mono" font-size="11" fill="#c4b5fd">Full-Stack</text>

    <rect x="251" y="0" width="105" height="26" rx="5" fill="#083344" stroke="#06b6d4" stroke-opacity="0.4" />
    <text x="261" y="17" class="mono" font-size="11" fill="#67e8f9">Tailwind CSS</text>

    <rect x="364" y="0" width="80" height="26" rx="5" fill="#0f291e" stroke="#10b981" stroke-opacity="0.4" />
    <text x="375" y="17" class="mono" font-size="11" fill="#6ee7b7">Node.js</text>

    <rect x="452" y="0" width="115" height="26" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.4" />
    <text x="462" y="17" class="mono" font-size="11" fill="#a5b4fc">Cloud Delivery</text>

    <rect x="575" y="0" width="168" height="26" rx="5" fill="#31102b" stroke="#db2777" stroke-opacity="0.4" />
    <text x="586" y="17" class="mono" font-size="11" fill="#f472b6">Client Engineering</text>
  </g>
</svg>

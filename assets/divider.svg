<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 30" width="100%" height="30">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0" />
      <stop offset="25%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="48%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f8fafc" stop-opacity="1" />
      <stop offset="52%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <line x1="100" y1="15" x2="1100" y2="15" stroke="url(#dividerGrad)" stroke-width="1.5" filter="url(#divGlow)" />
  
  <!-- Central Cyber Diamond -->
  <polygon points="600,8 607,15 600,22 593,15" fill="#22d3ee" filter="url(#divGlow)" />
  <circle cx="600" cy="15" r="2" fill="#f8fafc" />
</svg>

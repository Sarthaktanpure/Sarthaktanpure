<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <linearGradient id="arcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08051a" />
      <stop offset="50%" stop-color="#120c2e" />
      <stop offset="100%" stop-color="#060919" />
    </linearGradient>
    <linearGradient id="arcBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="35%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="arcGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .pixel { font-family: 'Courier New', monospace; font-weight: 800; letter-spacing: 2px; }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .blink-text { animation: blink 1.6s infinite; }
  </style>

  <!-- Frame -->
  <rect width="998" height="278" x="1" y="1" rx="18" fill="url(#arcBg)" stroke="url(#arcBorder)" stroke-width="1.8" />

  <!-- CRT Scanline Overlay -->
  <g opacity="0.08" stroke="#f8fafc" stroke-width="1">
    <line x1="0" y1="20" x2="1000" y2="20" />
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="100" x2="1000" y2="100" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="140" x2="1000" y2="140" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="180" x2="1000" y2="180" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="220" x2="1000" y2="220" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="0" y1="260" x2="1000" y2="260" />
  </g>

  <!-- Top Marquee -->
  <rect x="30" y="24" width="940" height="34" rx="8" fill="#1b1038" stroke="#3b1b68" />
  <circle cx="50" cy="41" r="5" fill="#ec4899" />
  <text x="68" y="45" class="mono" font-size="11" fill="#f472b6" letter-spacing="2">SARTHAK TANPURE // INTERACTIVE SIMULATION POD</text>
  <text x="820" y="45" class="mono" font-size="11" fill="#34d399">100% CLIENT SIDE</text>

  <!-- Main Arcade Title -->
  <text x="50" y="112" class="pixel" font-size="34" fill="#f8fafc" filter="url(#arcGlow)">THE ENGINEER'S ARCADE</text>
  <text x="50" y="138" class="mono" font-size="13" fill="#a78bfa">Interactive browser simulations · Real algorithmic puzzles &amp; terminal challenges</text>

  <!-- 3 Mini Game Channels -->
  <g transform="translate(50, 162)">
    <!-- Channel 1: Contribution Snake -->
    <rect x="0" y="0" width="280" height="74" rx="10" fill="#0f1f18" stroke="#10b981" stroke-width="1.2" />
    <text x="16" y="28" class="mono" font-size="12" fill="#34d399" font-weight="700">01 // CONTRIBUTION SNAKE</text>
    <text x="16" y="48" class="mono" font-size="11" fill="#94a3b8">GitHub activity as food pattern</text>
    <text x="16" y="64" class="mono" font-size="10" fill="#6ee7b7">▶ GitHub Actions Driven</text>

    <!-- Channel 2: Dev Quiz -->
    <rect x="310" y="0" width="280" height="74" rx="10" fill="#1e1035" stroke="#a855f7" stroke-width="1.2" />
    <text x="16" y="28" class="mono" font-size="12" fill="#c084fc" font-weight="700">02 // DEVELOPER QUIZ</text>
    <text x="16" y="48" class="mono" font-size="11" fill="#94a3b8">HTTP, DSA &amp; system architecture</text>
    <text x="16" y="64" class="mono" font-size="10" fill="#d8b4fe">▶ Instant Web Audio FX</text>

    <!-- Channel 3: Terminal Challenge -->
    <rect x="620" y="0" width="280" height="74" rx="10" fill="#0c1d2e" stroke="#06b6d4" stroke-width="1.2" />
    <text x="16" y="28" class="mono" font-size="12" fill="#22d3ee" font-weight="700">03 // TERMINAL CHALLENGE</text>
    <text x="16" y="48" class="mono" font-size="11" fill="#94a3b8">Unix CLI puzzle &amp; secret easter eggs</text>
    <text x="16" y="64" class="mono" font-size="10" fill="#67e8f9">▶ Full Interactive Shell</text>
  </g>

  <!-- Blink Prompt at Bottom Right -->
  <text x="948" y="256" class="mono blink-text" font-size="11" fill="#22d3ee" text-anchor="end">PRESS ANY LINK TO PLAY ▶</text>
</svg>

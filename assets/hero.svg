<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <radialGradient id="violetGlow" cx="15%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; letter-spacing: -1px; }
    .accent { fill: url(#textGrad); }
    
    @keyframes pulseDot {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .pulsing-dot {
      animation: pulseDot 2.2s infinite ease-in-out;
      transform-origin: 948px 48px;
    }

    @keyframes beamFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    .beam-line {
      stroke-dasharray: 120 180;
      animation: beamFlow 12s linear infinite;
    }
  </style>

  <!-- Card Canvas -->
  <rect width="1198" height="438" x="1" y="1" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect width="1198" height="438" x="1" y="1" rx="20" fill="url(#violetGlow)" />
  <rect width="1198" height="438" x="1" y="1" rx="20" fill="url(#cyanGlow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.12" stroke="#64748b" stroke-width="0.75">
    <line x1="60" y1="0" x2="60" y2="440" />
    <line x1="200" y1="0" x2="200" y2="440" />
    <line x1="340" y1="0" x2="340" y2="440" />
    <line x1="480" y1="0" x2="480" y2="440" />
    <line x1="620" y1="0" x2="620" y2="440" />
    <line x1="760" y1="0" x2="760" y2="440" />
    <line x1="900" y1="0" x2="900" y2="440" />
    <line x1="1040" y1="0" x2="1040" y2="440" />
    
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
  </g>

  <!-- Futuristic Wave Vector -->
  <path d="M-10 330 C 240 240, 420 380, 680 270 S 980 180, 1220 290" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="3" filter="url(#softGlow)" opacity="0.45" />
  <path class="beam-line" d="M-10 330 C 240 240, 420 380, 680 270 S 980 180, 1220 290" 
        fill="none" stroke="#22d3ee" stroke-width="1.8" opacity="0.8" />

  <!-- Top Terminal Bar -->
  <rect x="30" y="28" width="1140" height="42" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />
  
  <!-- Terminal Window Controls -->
  <circle cx="56" cy="49" r="6" fill="#ef4444" />
  <circle cx="76" cy="49" r="6" fill="#f59e0b" />
  <circle cx="96" cy="49" r="6" fill="#10b981" />
  
  <text x="124" y="53" class="mono" font-size="12" fill="#94a3b8" letter-spacing="1.5">SARTHAK_OS // KERNEL v3.4.0 — PRODUCTION WORKSPACE</text>

  <!-- Live Status Pulse -->
  <g class="pulsing-dot">
    <circle cx="948" cy="49" r="7" fill="#10b981" opacity="0.3" />
    <circle cx="948" cy="49" r="3.5" fill="#34d399" />
  </g>
  <text x="965" y="53" class="mono" font-size="11.5" fill="#34d399" font-weight="600">SYSTEM: ONLINE</text>
  <text x="1080" y="53" class="mono" font-size="11" fill="#64748b">12ms</text>

  <!-- Hero Content -->
  <!-- Tag / Identifier -->
  <rect x="52" y="104" width="232" height="26" rx="13" fill="#1e1b4b" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1" />
  <text x="68" y="121" class="mono" font-size="11" fill="#c4b5fd" letter-spacing="1.5" font-weight="600">⚡ SDE CANDIDATE · INDIA</text>

  <!-- Main Name -->
  <text x="50" y="196" class="sans title" font-size="64" fill="#f8fafc">Sarthak Tanpure</text>

  <!-- Primary Identity Gradient Subtitle -->
  <text x="52" y="240" class="mono accent" font-size="20" font-weight="700" letter-spacing="1">
    SOFTWARE ENGINEER · BACKEND · FULL-STACK · APPLIED AI
  </text>

  <!-- Mission Statement -->
  <text x="52" y="284" class="sans" font-size="17" fill="#cbd5e1" font-weight="400">
    I engineer dependable software that turns real-world workflows into high-performance systems.
  </text>
  <text x="52" y="312" class="sans" font-size="15" fill="#94a3b8">
    Specialized in scalable RESTful APIs, distributed architectures, microservices, and human-centered AI products.
  </text>

  <!-- Telemetry HUD Chips at Bottom -->
  <g transform="translate(52, 354)">
    <!-- Chip 1: Academic -->
    <rect x="0" y="0" width="248" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="14" y="18" class="mono" font-size="10" fill="#64748b" letter-spacing="1">ACADEMICS // PREC LONI</text>
    <text x="14" y="33" class="sans" font-size="13" fill="#38bdf8" font-weight="600">B.Tech IT · 9.0 / 10 CGPA</text>

    <!-- Chip 2: Algorithms -->
    <rect x="264" y="0" width="220" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="278" y="18" class="mono" font-size="10" fill="#64748b" letter-spacing="1">PROBLEM SOLVING</text>
    <text x="278" y="33" class="sans" font-size="13" fill="#a78bfa" font-weight="600">200+ Java DSA Solved</text>

    <!-- Chip 3: Production Engineering -->
    <rect x="500" y="0" width="280" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="514" y="18" class="mono" font-size="10" fill="#64748b" letter-spacing="1">ENGINEERING PORTFOLIO</text>
    <text x="514" y="33" class="sans" font-size="13" fill="#34d399" font-weight="600">5+ Full-Stack Production Builds</text>

    <!-- Chip 4: Venture Leadership -->
    <rect x="796" y="0" width="298" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="810" y="18" class="mono" font-size="10" fill="#64748b" letter-spacing="1">VENTURE &amp; ARCHITECTURE</text>
    <text x="810" y="33" class="sans" font-size="13" fill="#f43f5e" font-weight="600">Co-Founder @ WebCraft Studio</text>
  </g>
</svg>
